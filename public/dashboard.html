<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Agas Collection</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script>(function(){var t=localStorage.getItem('store-theme');if(t)document.documentElement.setAttribute('data-theme',t);}());</script>
</head>
<body>

<div class="promo-banner">Gratis ongkir untuk pembelian di atas <span>Rp 500.000</span> — Berlaku hari ini</div>

<header>
  <div class="container">
    <div class="header-inner">
      <a href="/" class="logo">Agas<span>Collection</span></a>
      <nav>
        <a href="/">Beranda</a>
        <a href="/products.html">Koleksi</a>
        <a href="/dashboard.html" class="active">Dashboard</a>
      </nav>
      <div class="header-actions">
        <a href="/cart.html" class="hdr-cart" title="Keranjang">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 11H4L5 9z"/></svg>
          <span class="cart-count">0</span>
        </a>
      </div>
      <button class="hamburger" id="hamburger" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
  <nav class="mobile-nav" id="mobile-nav">
    <a href="/">Beranda</a>
    <a href="/products.html">Koleksi</a>
    <a href="/dashboard.html">Dashboard</a>
  </nav>
</header>

<main>
  <div class="container">
    <div id="dashboard-content">
      <div class="dash-loading">
        <div class="skeleton" style="height:110px;margin:40px 0 24px"></div>
        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:28px">
          <div class="skeleton" style="height:90px"></div>
          <div class="skeleton" style="height:90px"></div>
          <div class="skeleton" style="height:90px"></div>
          <div class="skeleton" style="height:90px"></div>
        </div>
        <div class="skeleton" style="height:280px"></div>
      </div>
    </div>
  </div>
</main>

<footer style="margin-top:80px">
  <div class="container">
    <div class="footer-bottom" style="border:none;padding-top:0">
      <span>© 2026 Agas Collection</span>
      <a href="/" style="color:rgba(255,255,255,.4);font-size:.78rem">← Beranda</a>
    </div>
  </div>
</footer>

<script type="module">
import { Cart, fmt } from '/js/main.js';

document.getElementById('hamburger').addEventListener('click', () => {
  document.getElementById('mobile-nav').classList.toggle('open');
});

const STATUS_CONFIG = {
  'Pending':     { color: '#92400E', bg: '#FEF3C7', label: 'Menunggu Konfirmasi' },
  'Diproses':    { color: '#1E40AF', bg: '#DBEAFE', label: 'Sedang Diproses' },
  'Dikirim':     { color: '#6B21A8', bg: '#F3E8FF', label: 'Dalam Pengiriman' },
  'Selesai':     { color: '#166534', bg: '#DCFCE7', label: 'Pesanan Selesai' },
  'Dibatalkan':  { color: '#991B1B', bg: '#FEE2E2', label: 'Dibatalkan' },
};

function statusBadge(status) {
  const s = STATUS_CONFIG[status] || { color: '#555', bg: '#F5F5F5', label: status };
  return `<span class="status-badge" style="background:${s.bg};color:${s.color}">${s.label}</span>`;
}

function parseItems(raw) {
  if (!raw) return '-';
  try {
    const arr = typeof raw === 'string' ? JSON.parse(raw) : raw;
    if (!Array.isArray(arr)) return String(raw);
    return arr.map(i =>
      `<span class="order-item-chip">${i.name} <em>${i.size} · ${i.color} ×${i.qty}</em></span>`
    ).join('');
  } catch { return String(raw); }
}

function formatDate(dateStr) {
  if (!dateStr) return '-';
  const d = new Date(dateStr);
  if (isNaN(d)) return dateStr;
  return d.toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
}

function trackingBar(status) {
  const steps = ['Dikonfirmasi', 'Diproses', 'Dikirim', 'Selesai'];
  const activeIdx = { 'Pending': 0, 'Diproses': 1, 'Dikirim': 2, 'Selesai': 3 }[status] ?? -1;
  if (activeIdx < 0) return '';
  let html = '<div class="order-tracking-bar">';
  steps.forEach((s, i) => {
    const done = i < activeIdx;
    const active = i === activeIdx;
    html += `<div class="tracking-step ${done?'done':''} ${active?'active':''}"><span class="ts-dot"></span><span class="ts-label">${s}</span></div>`;
    if (i < steps.length - 1) html += `<div class="tracking-line ${done?'done':''}"></div>`;
  });
  html += '</div>';
  return html;
}

async function load() {
  const el = document.getElementById('dashboard-content');

  const [userRes, ordersRes] = await Promise.all([
    fetch('/auth/me'),
    fetch('/api/my-orders')
  ]);

  if (!userRes.ok) { window.location.href = '/login.html'; return; }

  const user   = await userRes.json();
  const orders = ordersRes.ok ? await ordersRes.json() : [];

  const totalBelanja = orders.reduce((s, o) => s + Number(o.total || 0), 0);
  const pending      = orders.filter(o => o.status === 'Pending' || o.status === 'Diproses').length;
  const selesai      = orders.filter(o => o.status === 'Selesai').length;

  el.innerHTML = `
    <div class="dash-profile">
      <img src="${user.photo || ''}" alt="${user.name}" class="dash-avatar" onerror="this.style.display='none'">
      <div class="dash-profile-info">
        <p class="dash-greeting">Selamat datang,</p>
        <h1 class="dash-name">${user.name}</h1>
        <p class="dash-email">${user.email}</p>
      </div>
      <a href="/auth/logout" class="btn btn-outline btn-sm" style="margin-left:auto;flex-shrink:0">Keluar</a>
    </div>

    <div class="dash-stats">
      <div class="stat-card">
        <p class="stat-label">Total Pesanan</p>
        <p class="stat-value">${orders.length}</p>
      </div>
      <div class="stat-card">
        <p class="stat-label">Total Belanja</p>
        <p class="stat-value" style="font-size:1.35rem">${fmt(totalBelanja)}</p>
      </div>
      <div class="stat-card">
        <p class="stat-label">Aktif</p>
        <p class="stat-value" style="color:var(--accent)">${pending}</p>
      </div>
      <div class="stat-card">
        <p class="stat-label">Selesai</p>
        <p class="stat-value" style="color:#27AE60">${selesai}</p>
      </div>
    </div>

    <div class="dash-section">
      <div class="dash-section-header">
        <h2>Riwayat Pesanan</h2>
        <a href="/products.html" class="btn btn-primary btn-sm">Belanja Lagi</a>
      </div>

      ${orders.length === 0 ? `
        <div class="cart-empty" style="padding:60px 0">
          <div class="cart-empty-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
          </div>
          <h3 style="font-size:1.4rem;margin-bottom:8px">Belum Ada Pesanan</h3>
          <p style="color:var(--text-muted);margin-bottom:24px">Mulai belanja dan pesananmu akan muncul di sini.</p>
          <a href="/products.html" class="btn btn-primary">Lihat Koleksi</a>
        </div>
      ` : `
        <div class="orders-list">
          ${orders.slice().reverse().map(o => `
            <div class="order-card">
              <div class="order-card-top">
                <div>
                  <p class="order-id">${o.id}</p>
                  <p class="order-date">${formatDate(o.date)}</p>
                </div>
                ${statusBadge(o.status)}
              </div>
              <div class="order-card-body">
                <div class="order-items-preview">${parseItems(o.items)}</div>
                ${o.notes ? `<p class="order-notes">${o.notes}</p>` : ''}
              </div>
              <div class="order-card-footer">
                <div class="order-shipping">
                  <span>${o.city || '-'}</span>
                  <span style="margin-left:14px">${o.name}</span>
                </div>
                <div class="order-total">${fmt(o.total)}</div>
              </div>
              ${trackingBar(o.status)}
            </div>
          `).join('')}
        </div>
      `}
    </div>
  `;
}

load().catch(() => {
  document.getElementById('dashboard-content').innerHTML =
    '<p style="text-align:center;padding:80px;color:var(--text-muted)">Gagal memuat dashboard. Coba refresh halaman.</p>';
});
</script>
</body>
</html>
