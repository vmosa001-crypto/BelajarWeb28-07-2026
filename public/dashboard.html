<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Agas Collection</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script>(function(){var t=localStorage.getItem('store-theme');if(t)document.documentElement.setAttribute('data-theme',t);}());</script>
</head>
<body>

<div class="promo-banner">Gratis ongkir untuk pembelian di atas <span>Rp 500.000</span> 🎉</div>

<header>
  <div class="container">
    <div class="header-inner">
      <a href="/" class="logo">Agas<span>Collection</span><small style="display:block;font-size:0.5em;letter-spacing:0.15em;text-transform:uppercase;color:var(--accent);font-weight:400">Lombok</small></a>
      <nav>
        <a href="/">Beranda</a>
        <a href="/products.html">Koleksi</a>
        <a href="/dashboard.html" class="active">Dashboard</a>
      </nav>
      <div class="header-actions">
        <a href="/cart.html" class="hdr-cart" title="Keranjang">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 11H4L5 9z"/></svg>
          <span class="cart-count">0</span>
        </a>
      </div>
    </div>
  </div>
</header>

<main>
  <div class="container">
    <div id="dashboard-content">
      <div class="dash-loading">
        <div class="skeleton" style="height:120px;border-radius:16px;margin-bottom:24px"></div>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-bottom:32px">
          <div class="skeleton" style="height:90px;border-radius:12px"></div>
          <div class="skeleton" style="height:90px;border-radius:12px"></div>
          <div class="skeleton" style="height:90px;border-radius:12px"></div>
        </div>
        <div class="skeleton" style="height:300px;border-radius:16px"></div>
      </div>
    </div>
  </div>
</main>

<footer style="background:var(--text);color:#888;text-align:center;padding:24px;margin-top:80px">
  <p style="font-size:.85rem">© 2026 Agas Collection — <a href="/" style="color:var(--accent)">Beranda</a></p>
</footer>

<script type="module">
import { Cart, fmt } from '/js/main.js';

const STATUS_CONFIG = {
  'Pending':     { color: '#F39C12', bg: '#FEF9EC', icon: '🕐', label: 'Menunggu Konfirmasi' },
  'Diproses':    { color: '#2980B9', bg: '#EBF5FB', icon: '⚙️', label: 'Sedang Diproses' },
  'Dikirim':     { color: '#8E44AD', bg: '#F5EEF8', icon: '🚚', label: 'Dalam Pengiriman' },
  'Selesai':     { color: '#27AE60', bg: '#EAFAF1', icon: '✅', label: 'Pesanan Selesai' },
  'Dibatalkan':  { color: '#C0392B', bg: '#FDEDEC', icon: '❌', label: 'Dibatalkan' },
};

function statusBadge(status) {
  const s = STATUS_CONFIG[status] || { color: '#888', bg: '#F5F5F5', icon: '📦', label: status };
  return `<span class="status-badge" style="background:${s.bg};color:${s.color}">${s.icon} ${s.label}</span>`;
}

function parseItems(raw) {
  if (!raw) return '-';
  try {
    const arr = typeof raw === 'string' ? JSON.parse(raw) : raw;
    if (!Array.isArray(arr)) return String(raw);
    return arr.map(i =>
      `<span class="order-item-chip">${i.name} <em>${i.size} · ${i.color}</em> ×${i.qty}</span>`
    ).join('');
  } catch {
    return String(raw); // fallback: teks biasa (format lama)
  }
}

function formatDate(dateStr) {
  if (!dateStr) return '-';
  const d = new Date(dateStr);
  if (isNaN(d)) return dateStr;
  return d.toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
}

async function load() {
  const el = document.getElementById('dashboard-content');

  // Ambil user & pesanan secara paralel
  const [userRes, ordersRes] = await Promise.all([
    fetch('/auth/me'),
    fetch('/api/my-orders')
  ]);

  if (!userRes.ok) {
    window.location.href = '/login.html';
    return;
  }

  const user   = await userRes.json();
  const orders = ordersRes.ok ? await ordersRes.json() : [];

  // Hitung statistik
  const totalBelanja = orders.reduce((s, o) => s + Number(o.total || 0), 0);
  const pending      = orders.filter(o => o.status === 'Pending' || o.status === 'Diproses').length;
  const selesai      = orders.filter(o => o.status === 'Selesai').length;

  el.innerHTML = `
    <!-- Profil -->
    <div class="dash-profile">
      <img src="${user.photo || ''}" alt="${user.name}" class="dash-avatar" onerror="this.style.display='none'">
      <div class="dash-profile-info">
        <p class="dash-greeting">Halo,</p>
        <h1 class="dash-name">${user.name}</h1>
        <p class="dash-email">${user.email}</p>
      </div>
      <a href="/auth/logout" class="btn btn-outline btn-sm" style="margin-left:auto">Keluar</a>
    </div>

    <!-- Statistik -->
    <div class="dash-stats">
      <div class="stat-card">
        <p class="stat-label">Total Pesanan</p>
        <p class="stat-value">${orders.length}</p>
      </div>
      <div class="stat-card">
        <p class="stat-label">Total Belanja</p>
        <p class="stat-value" style="font-size:1.3rem">${fmt(totalBelanja)}</p>
      </div>
      <div class="stat-card">
        <p class="stat-label">Aktif / Diproses</p>
        <p class="stat-value" style="color:var(--accent-dark)">${pending}</p>
      </div>
      <div class="stat-card">
        <p class="stat-label">Pesanan Selesai</p>
        <p class="stat-value" style="color:#27AE60">${selesai}</p>
      </div>
    </div>

    <!-- Riwayat Pesanan -->
    <div class="dash-section">
      <div class="dash-section-header">
        <h2>Riwayat Pesanan</h2>
        <a href="/products.html" class="btn btn-primary btn-sm">+ Belanja Lagi</a>
      </div>

      ${orders.length === 0 ? `
        <div class="cart-empty" style="padding:60px 0">
          <div style="font-size:3rem;margin-bottom:16px">📦</div>
          <h3>Belum Ada Pesanan</h3>
          <p style="color:var(--text-muted);margin:12px 0 24px">Mulai belanja sekarang dan pesananmu akan muncul di sini.</p>
          <a href="/products.html" class="btn btn-primary">Lihat Koleksi</a>
        </div>
      ` : `
        <div class="orders-list">
          ${orders.slice().reverse().map(o => `
            <div class="order-card">
              <div class="order-card-top">
                <div>
                  <p class="order-id">${o.id}</p>
                  <p class="order-date">${formatDate(o.date)}</p>
                </div>
                ${statusBadge(o.status)}
              </div>
              <div class="order-card-body">
                <div class="order-items-preview">${parseItems(o.items)}</div>
                ${o.notes ? `<p class="order-notes">📝 ${o.notes}</p>` : ''}
              </div>
              <div class="order-card-footer">
                <div class="order-shipping">
                  <span>📍 ${o.city || '-'}</span>
                  <span style="margin-left:16px">👤 ${o.name}</span>
                </div>
                <div class="order-total">${fmt(o.total)}</div>
              </div>
              ${(o.status === 'Dikirim') ? `
                <div class="order-tracking-bar">
                  <div class="tracking-step done"><span class="ts-dot"></span><span class="ts-label">Dikonfirmasi</span></div>
                  <div class="tracking-line done"></div>
                  <div class="tracking-step done"><span class="ts-dot"></span><span class="ts-label">Diproses</span></div>
                  <div class="tracking-line done"></div>
                  <div class="tracking-step active"><span class="ts-dot"></span><span class="ts-label">Dikirim</span></div>
                  <div class="tracking-line"></div>
                  <div class="tracking-step"><span class="ts-dot"></span><span class="ts-label">Selesai</span></div>
                </div>
              ` : o.status === 'Diproses' ? `
                <div class="order-tracking-bar">
                  <div class="tracking-step done"><span class="ts-dot"></span><span class="ts-label">Dikonfirmasi</span></div>
                  <div class="tracking-line done"></div>
                  <div class="tracking-step active"><span class="ts-dot"></span><span class="ts-label">Diproses</span></div>
                  <div class="tracking-line"></div>
                  <div class="tracking-step"><span class="ts-dot"></span><span class="ts-label">Dikirim</span></div>
                  <div class="tracking-line"></div>
                  <div class="tracking-step"><span class="ts-dot"></span><span class="ts-label">Selesai</span></div>
                </div>
              ` : o.status === 'Selesai' ? `
                <div class="order-tracking-bar">
                  <div class="tracking-step done"><span class="ts-dot"></span><span class="ts-label">Dikonfirmasi</span></div>
                  <div class="tracking-line done"></div>
                  <div class="tracking-step done"><span class="ts-dot"></span><span class="ts-label">Diproses</span></div>
                  <div class="tracking-line done"></div>
                  <div class="tracking-step done"><span class="ts-dot"></span><span class="ts-label">Dikirim</span></div>
                  <div class="tracking-line done"></div>
                  <div class="tracking-step done"><span class="ts-dot"></span><span class="ts-label">Selesai</span></div>
                </div>
              ` : ''}
            </div>
          `).join('')}
        </div>
      `}
    </div>
  `;
}

load().catch(err => {
  console.error(err);
  document.getElementById('dashboard-content').innerHTML =
    '<p style="text-align:center;padding:60px;color:var(--text-muted)">Gagal memuat dashboard. Coba refresh halaman.</p>';
});
</script>
</body>
</html>
