<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout — Agas Collection</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script>(function(){var t=localStorage.getItem('store-theme');if(t)document.documentElement.setAttribute('data-theme',t);}());</script>
</head>
<body>

<div class="nav-overlay" id="nav-overlay"></div>
<aside class="nav-sidebar" id="nav-sidebar">
  <div class="nav-sidebar-head">
    <a href="/" class="logo">Agas<span>Collection</span></a>
    <button class="nav-sidebar-close" id="nav-sidebar-close" aria-label="Tutup">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  <nav class="nav-sidebar-links">
    <a href="/">Beranda</a>
    <a href="/products.html">Koleksi</a>
  </nav>
  <div class="nav-sidebar-user" id="sidebar-user-section" style="display:none">
    <div class="nav-sidebar-avatar" id="sidebar-avatar"></div>
    <div>
      <p id="sidebar-user-name" style="font-weight:600;font-size:.86rem;color:var(--text)"></p>
      <span id="sidebar-user-email" style="font-size:.73rem;color:var(--text-muted)"></span>
    </div>
  </div>
  <a href="/auth/logout" class="nav-sidebar-logout" id="sidebar-logout" style="display:none">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    Keluar
  </a>
</aside>

<header>
  <div class="container">
    <div class="header-inner">
      <button class="mob-menu" id="mob-menu-btn" aria-label="Menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <a href="/" class="logo">Agas<span>Collection</span></a>
      <nav>
        <a href="/">Beranda</a>
        <a href="/products.html">Koleksi</a>
      </nav>
      <div class="header-actions">
        <a href="/cart.html" class="hdr-cart" title="Keranjang">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 11H4L5 9z"/></svg>
          <span class="cart-count">0</span>
        </a>
        <button class="hdr-avatar-btn" id="hdr-avatar-btn" title="Profil" onclick="window.location='/dashboard.html'">
          <span class="hdr-avatar-initials" id="hdr-avatar-initials"></span>
        </button>
      </div>
    </div>
  </div>
</header>

<main>
  <div class="container">
    <div class="page-title">
      <p class="breadcrumb"><a href="/">Beranda</a> <span>/</span> <a href="/cart.html">Keranjang</a> <span>/</span> Checkout</p>
      <h1>Checkout</h1>
    </div>
    <div id="checkout-content"></div>
  </div>
</main>

<footer>
  <div class="container">
    <div class="footer-bottom" style="border:none;padding-top:0">
      <span>© 2026 Agas Collection</span>
      <a href="/cart.html" style="color:rgba(255,255,255,.4);font-size:.78rem">← Kembali ke Keranjang</a>
    </div>
  </div>
</footer>

<script type="module">
import { Cart, fmt, toast, getUser, cartReady } from '/js/main.js';

// Sidebar nav
function openSidebar() {
  document.getElementById('nav-sidebar').classList.add('open');
  document.getElementById('nav-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeSidebar() {
  document.getElementById('nav-sidebar').classList.remove('open');
  document.getElementById('nav-overlay').classList.remove('open');
  document.body.style.overflow = '';
}
document.getElementById('mob-menu-btn').addEventListener('click', openSidebar);
document.getElementById('nav-overlay').addEventListener('click', closeSidebar);
document.getElementById('nav-sidebar-close').addEventListener('click', closeSidebar);

fetch('/auth/user').then(r => r.ok ? r.json() : null).then(user => {
  if (!user) return;
  const btn = document.getElementById('hdr-avatar-btn');
  const el = document.getElementById('hdr-avatar-initials');
  if (user.photo) { el.outerHTML = `<img src="${user.photo}" alt="${user.name}">`; }
  else { el.textContent = (user.name || '?')[0].toUpperCase(); }
  btn.classList.add('visible');
  const sec = document.getElementById('sidebar-user-section');
  const av = document.getElementById('sidebar-avatar');
  document.getElementById('sidebar-user-name').textContent = user.name || '';
  document.getElementById('sidebar-user-email').textContent = user.email || '';
  if (user.photo) av.innerHTML = `<img src="${user.photo}" alt="${user.name}">`;
  else av.textContent = (user.name || '?')[0].toUpperCase();
  sec.style.display = 'flex';
  document.getElementById('sidebar-logout').style.display = 'flex';
}).catch(() => {});

const SHIPPING = 25000;
const FREE_SHIPPING_MIN = 500000;

function renderEmpty() {
  document.getElementById('checkout-content').innerHTML = `
    <div class="cart-empty">
      <div class="cart-empty-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 11H4L5 9z"/></svg>
      </div>
      <h2>Keranjang Kosong</h2>
      <p>Tambahkan produk ke keranjang sebelum checkout.</p>
      <a href="/products.html" class="btn btn-primary">Lihat Koleksi</a>
    </div>`;
}

function renderSuccess(orderId) {
  Cart.clear();
  document.getElementById('checkout-content').innerHTML = `
    <div class="success-page">
      <div class="success-icon">🎉</div>
      <h2>Pesanan Berhasil!</h2>
      <p>Terima kasih telah berbelanja di Agas Collection. Kami akan segera memproses pesananmu.</p>
      <div class="order-id-box">
        <p>Nomor Pesanan</p>
        <strong>${orderId}</strong>
      </div>
      <div style="display:flex;gap:14px;justify-content:center;flex-wrap:wrap">
        <a href="/dashboard.html" class="btn btn-primary btn-lg">Lacak Pesanan</a>
        <a href="/products.html" class="btn btn-outline btn-lg">Lanjut Belanja</a>
      </div>
    </div>`;
}

function render() {
  const items = Cart.get();
  if (!items.length) return renderEmpty();

  const subtotal = Cart.total();
  const shipping = subtotal >= FREE_SHIPPING_MIN ? 0 : SHIPPING;
  const total = subtotal + shipping;

  const payments = ['Transfer Bank BCA', 'Transfer Bank Mandiri', 'DANA / GoPay / OVO', 'COD (Bayar di Tempat)'];

  document.getElementById('checkout-content').innerHTML = `
    <div class="checkout-layout">
      <div>
        <form id="checkout-form">
          <div class="form-section">
            <h3>Informasi Pengiriman</h3>
            <div class="form-grid">
              <div class="form-group">
                <label>Nama Lengkap *</label>
                <input type="text" name="name" required placeholder="Nama penerima">
              </div>
              <div class="form-group">
                <label>No. WhatsApp *</label>
                <input type="tel" name="phone" required placeholder="08xxxxxxxxxx">
              </div>
              <div class="form-group">
                <label>Email *</label>
                <input type="email" name="email" required placeholder="email@kamu.com">
              </div>
              <div class="form-group">
                <label>Kota / Kabupaten *</label>
                <input type="text" name="city" required placeholder="Jakarta Selatan">
              </div>
              <div class="form-group form-full">
                <label>Alamat Lengkap *</label>
                <textarea name="address" required placeholder="Jalan, nomor rumah, RT/RW, kelurahan, kecamatan, kode pos"></textarea>
              </div>
            </div>
          </div>

          <div class="form-section">
            <h3>Metode Pembayaran</h3>
            <div style="display:flex;flex-direction:column;gap:10px">
              ${payments.map((m, i) => `
                <label class="payment-option">
                  <input type="radio" name="payment" value="${m}" ${i===0?'checked':''} required style="accent-color:var(--accent)">
                  <span>${m}</span>
                </label>`).join('')}
            </div>
          </div>

          <div class="form-section">
            <h3>Catatan <span style="font-size:.78rem;font-weight:400;color:var(--text-muted)">(Opsional)</span></h3>
            <div class="form-group">
              <textarea name="note" placeholder="Catatan khusus untuk penjual..."></textarea>
            </div>
          </div>

          <button type="submit" class="btn btn-primary btn-lg btn-block" id="submit-btn">
            Buat Pesanan — ${fmt(total)}
          </button>
        </form>
      </div>

      <div class="order-summary">
        <h3>Pesanan (${items.length} item)</h3>
        ${items.map(i => `
          <div class="summary-row" style="align-items:flex-start;gap:12px">
            <span style="display:flex;align-items:flex-start;gap:10px;flex:1;min-width:0">
              <img src="${i.image}" style="width:38px;height:50px;object-fit:cover;border-radius:3px;flex-shrink:0">
              <span style="font-size:.82rem;line-height:1.45">${i.name}<br><span style="color:var(--text-muted)">${i.size} · ${i.color} ×${i.qty}</span></span>
            </span>
            <span style="white-space:nowrap;font-size:.85rem">${fmt(i.price * i.qty)}</span>
          </div>`).join('')}
        <div class="summary-row"><span>Subtotal</span><span>${fmt(subtotal)}</span></div>
        <div class="summary-row">
          <span>Ongkos Kirim</span>
          <span>${shipping === 0 ? '<span style="color:var(--success);font-weight:600">GRATIS</span>' : fmt(shipping)}</span>
        </div>
        <div class="summary-row summary-total">
          <span>Total</span>
          <span style="color:var(--accent)">${fmt(total)}</span>
        </div>
      </div>
    </div>`;

  getUser().then(user => {
    if (!user) return;
    const form = document.getElementById('checkout-form');
    if (!form) return;
    const nameInput  = form.querySelector('[name="name"]');
    const emailInput = form.querySelector('[name="email"]');
    if (nameInput  && !nameInput.value)  nameInput.value  = user.name;
    if (emailInput && !emailInput.value) emailInput.value = user.email;
  });

  document.getElementById('checkout-form').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = document.getElementById('submit-btn');
    btn.disabled = true;
    btn.textContent = 'Memproses...';

    const fd = new FormData(e.target);
    const body = {
      name: fd.get('name'), email: fd.get('email'), phone: fd.get('phone'),
      address: fd.get('address'), city: fd.get('city'),
      payment: fd.get('payment'), note: fd.get('note'),
      items, total
    };

    try {
      const res = await fetch('/api/orders', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      const data = await res.json();
      if (data.success) renderSuccess(data.orderId);
      else throw new Error(data.error);
    } catch (err) {
      toast('Gagal membuat pesanan. Coba lagi.', 'error');
      btn.disabled = false;
      btn.textContent = `Buat Pesanan — ${fmt(total)}`;
    }
  });
}

cartReady.then(render);
</script>
</body>
</html>
