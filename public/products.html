<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Koleksi — Agas Collection</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script>(function(){var t=localStorage.getItem('store-theme');if(t)document.documentElement.setAttribute('data-theme',t);}());</script>
</head>
<body>

<div class="promo-banner">Gratis ongkir untuk pembelian di atas <span>Rp 500.000</span> — Berlaku hari ini</div>

<div class="nav-overlay" id="nav-overlay"></div>
<aside class="nav-sidebar" id="nav-sidebar">
  <div class="nav-sidebar-head">
    <a href="/" class="logo">Agas<span>Collection</span></a>
    <button class="nav-sidebar-close" id="nav-sidebar-close" aria-label="Tutup">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  <nav class="nav-sidebar-links">
    <a href="/">Beranda</a>
    <a href="/products.html" class="active">Koleksi</a>
  </nav>
  <div class="nav-sidebar-user" id="sidebar-user-section" style="display:none">
    <div class="nav-sidebar-avatar" id="sidebar-avatar"></div>
    <div>
      <p id="sidebar-user-name" style="font-weight:600;font-size:.86rem;color:var(--text)"></p>
      <span id="sidebar-user-email" style="font-size:.73rem;color:var(--text-muted)"></span>
    </div>
  </div>
  <a href="/auth/logout" class="nav-sidebar-logout" id="sidebar-logout" style="display:none">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    Keluar
  </a>
</aside>

<header>
  <div class="container">
    <div class="header-inner">
      <a href="/" class="logo">Agas<span>Collection</span></a>
      <nav>
        <a href="/">Beranda</a>
        <a href="/products.html" class="active">Koleksi</a>
      </nav>
      <div class="header-actions">
        <button class="hdr-avatar-btn" id="hdr-avatar-btn" title="Profil" onclick="window.location='/dashboard.html'">
          <span class="hdr-avatar-initials" id="hdr-avatar-initials"></span>
        </button>
        <a href="/cart.html" class="hdr-cart" title="Keranjang">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 11H4L5 9z"/></svg>
          <span class="cart-count">0</span>
        </a>
      </div>
      <button class="mob-menu" id="mob-menu-btn" aria-label="Menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
    </div>
  </div>
</header>

<main>
  <div class="container">
    <div class="page-title">
      <p class="breadcrumb"><a href="/">Beranda</a> <span>/</span> Koleksi</p>
      <h1>Semua Koleksi</h1>
    </div>

    <div class="filter-bar">
      <button class="filter-btn active" data-cat="">Semua</button>
      <button class="filter-btn" data-cat="Atasan">Atasan</button>
      <button class="filter-btn" data-cat="Bawahan">Bawahan</button>
      <button class="filter-btn" data-cat="Dress">Dress</button>
      <button class="filter-btn" data-cat="Outer">Outer</button>
      <div class="search-box">
        <input type="text" id="search-input" placeholder="Cari produk...">
        <button id="search-btn">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path stroke-linecap="round" d="M21 21l-4.35-4.35"/></svg>
        </button>
      </div>
    </div>

    <div id="products-count" style="font-size:.8rem;color:var(--text-muted);margin-bottom:28px;letter-spacing:.03em"></div>

    <div class="grid-4" id="product-grid">
      <div class="skeleton" style="height:380px"></div>
      <div class="skeleton" style="height:380px"></div>
      <div class="skeleton" style="height:380px"></div>
      <div class="skeleton" style="height:380px"></div>
    </div>
  </div>
</main>

<footer>
  <div class="container">
    <div class="footer-bottom" style="border:none;padding-top:0">
      <span>© 2026 Agas Collection</span>
      <a href="/" style="color:rgba(255,255,255,.4);font-size:.78rem">← Kembali ke Beranda</a>
    </div>
  </div>
</footer>

<script type="module">
import { fmt, apiFetch } from '/js/main.js';

// Sidebar nav
function openSidebar() {
  document.getElementById('nav-sidebar').classList.add('open');
  document.getElementById('nav-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeSidebar() {
  document.getElementById('nav-sidebar').classList.remove('open');
  document.getElementById('nav-overlay').classList.remove('open');
  document.body.style.overflow = '';
}
document.getElementById('mob-menu-btn').addEventListener('click', openSidebar);
document.getElementById('nav-overlay').addEventListener('click', closeSidebar);
document.getElementById('nav-sidebar-close').addEventListener('click', closeSidebar);

fetch('/auth/user').then(r => r.ok ? r.json() : null).then(user => {
  if (!user) return;
  const btn = document.getElementById('hdr-avatar-btn');
  const el = document.getElementById('hdr-avatar-initials');
  if (user.photo) { el.outerHTML = `<img src="${user.photo}" alt="${user.name}">`; }
  else { el.textContent = (user.name || '?')[0].toUpperCase(); }
  btn.classList.add('visible');
  const sec = document.getElementById('sidebar-user-section');
  const av = document.getElementById('sidebar-avatar');
  document.getElementById('sidebar-user-name').textContent = user.name || '';
  document.getElementById('sidebar-user-email').textContent = user.email || '';
  if (user.photo) av.innerHTML = `<img src="${user.photo}" alt="${user.name}">`;
  else av.textContent = (user.name || '?')[0].toUpperCase();
  sec.style.display = 'flex';
  document.getElementById('sidebar-logout').style.display = 'flex';
}).catch(() => {});

let activeCategory = new URLSearchParams(location.search).get('category') || '';
let activeSearch = '';

function renderCard(p) {
  return `
    <a href="/product.html?id=${p.id}" class="product-card fade-in">
      <div class="product-card-img">
        <img src="${p.image}" alt="${p.name}" loading="lazy">
        ${p.featured ? '<span class="product-badge">Unggulan</span>' : ''}
      </div>
      <div class="product-card-body">
        <p class="product-category">${p.category}</p>
        <p class="product-name">${p.name}</p>
        <p class="product-price">${fmt(p.price)}</p>
      </div>
      <div class="product-card-footer">
        <button class="btn btn-outline btn-sm btn-block">Lihat Detail</button>
      </div>
    </a>`;
}

const observer = new IntersectionObserver(entries => {
  entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); observer.unobserve(e.target); } });
}, { threshold: 0.05 });

async function loadProducts() {
  const grid = document.getElementById('product-grid');
  const countEl = document.getElementById('products-count');
  grid.innerHTML = '<div class="skeleton" style="height:380px"></div>'.repeat(4);

  let url = '/api/products?';
  if (activeCategory) url += `category=${encodeURIComponent(activeCategory)}&`;
  if (activeSearch) url += `search=${encodeURIComponent(activeSearch)}&`;

  try {
    const products = await apiFetch(url);
    if (!products.length) {
      grid.innerHTML = '<p style="color:var(--text-muted);padding:60px 0;grid-column:1/-1">Tidak ada produk ditemukan.</p>';
      countEl.textContent = '';
      return;
    }
    countEl.textContent = `Menampilkan ${products.length} produk`;
    grid.innerHTML = products.map(renderCard).join('');
    grid.querySelectorAll('.fade-in').forEach(el => observer.observe(el));
  } catch {
    grid.innerHTML = '<p style="color:var(--text-muted);grid-column:1/-1">Gagal memuat produk.</p>';
  }
}

// Set active filter from URL
document.querySelectorAll('.filter-btn').forEach(btn => {
  if (btn.dataset.cat === activeCategory) btn.classList.add('active');
  else if (activeCategory) btn.classList.remove('active');

  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeCategory = btn.dataset.cat;
    loadProducts();
  });
});

document.getElementById('search-btn').addEventListener('click', () => {
  activeSearch = document.getElementById('search-input').value.trim();
  loadProducts();
});
document.getElementById('search-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') { activeSearch = e.target.value.trim(); loadProducts(); }
});

loadProducts();
</script>
</body>
</html>
