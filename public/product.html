<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detail Produk — Agas Collection</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script>(function(){var t=localStorage.getItem('store-theme');if(t)document.documentElement.setAttribute('data-theme',t);}());</script>
</head>
<body>

<div class="promo-banner">Gratis ongkir untuk pembelian di atas <span>Rp 500.000</span> — Berlaku hari ini</div>

<div class="nav-overlay" id="nav-overlay"></div>
<aside class="nav-sidebar" id="nav-sidebar">
  <div class="nav-sidebar-head">
    <a href="/" class="logo">Agas<span>Collection</span></a>
    <button class="nav-sidebar-close" id="nav-sidebar-close" aria-label="Tutup">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  <nav class="nav-sidebar-links">
    <a href="/">Beranda</a>
    <a href="/products.html">Koleksi</a>
  </nav>
  <div class="nav-sidebar-user" id="sidebar-user-section" style="display:none">
    <div class="nav-sidebar-avatar" id="sidebar-avatar"></div>
    <div>
      <p id="sidebar-user-name" style="font-weight:600;font-size:.86rem;color:var(--text)"></p>
      <span id="sidebar-user-email" style="font-size:.73rem;color:var(--text-muted)"></span>
    </div>
  </div>
  <a href="/auth/logout" class="nav-sidebar-logout" id="sidebar-logout" style="display:none">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    Keluar
  </a>
</aside>

<header>
  <div class="container">
    <div class="header-inner">
      <a href="/" class="logo">Agas<span>Collection</span></a>
      <nav>
        <a href="/">Beranda</a>
        <a href="/products.html">Koleksi</a>
      </nav>
      <div class="header-actions">
        <button class="hdr-avatar-btn" id="hdr-avatar-btn" title="Profil" onclick="window.location='/dashboard.html'">
          <span class="hdr-avatar-initials" id="hdr-avatar-initials"></span>
        </button>
        <a href="/cart.html" class="hdr-cart" title="Keranjang">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 11H4L5 9z"/></svg>
          <span class="cart-count">0</span>
        </a>
      </div>
      <button class="mob-menu" id="mob-menu-btn" aria-label="Menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
    </div>
  </div>
</header>

<main>
  <div class="container">
    <p class="breadcrumb" style="padding:28px 0 0">
      <a href="/">Beranda</a> <span>/</span>
      <a href="/products.html">Koleksi</a> <span>/</span>
      <span id="bc-name">Produk</span>
    </p>

    <div class="product-detail" id="product-detail">
      <div class="skeleton" style="aspect-ratio:3/4;border-radius:4px"></div>
      <div style="display:flex;flex-direction:column;gap:20px">
        <div class="skeleton" style="height:36px;width:60%"></div>
        <div class="skeleton" style="height:52px;width:80%"></div>
        <div class="skeleton" style="height:100px"></div>
        <div class="skeleton" style="height:54px;width:50%"></div>
        <div class="skeleton" style="height:54px"></div>
      </div>
    </div>
  </div>
</main>

<footer>
  <div class="container">
    <div class="footer-bottom" style="border:none;padding-top:0">
      <span>© 2026 Agas Collection</span>
      <a href="/products.html" style="color:rgba(255,255,255,.4);font-size:.78rem">← Kembali ke Koleksi</a>
    </div>
  </div>
</footer>

<script type="module">
import { Cart, fmt, toast, apiFetch } from '/js/main.js';

// Sidebar nav
function openSidebar() {
  document.getElementById('nav-sidebar').classList.add('open');
  document.getElementById('nav-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeSidebar() {
  document.getElementById('nav-sidebar').classList.remove('open');
  document.getElementById('nav-overlay').classList.remove('open');
  document.body.style.overflow = '';
}
document.getElementById('mob-menu-btn').addEventListener('click', openSidebar);
document.getElementById('nav-overlay').addEventListener('click', closeSidebar);
document.getElementById('nav-sidebar-close').addEventListener('click', closeSidebar);

fetch('/auth/user').then(r => r.ok ? r.json() : null).then(user => {
  if (!user) return;
  const btn = document.getElementById('hdr-avatar-btn');
  const el = document.getElementById('hdr-avatar-initials');
  if (user.photo) { el.outerHTML = `<img src="${user.photo}" alt="${user.name}">`; }
  else { el.textContent = (user.name || '?')[0].toUpperCase(); }
  btn.classList.add('visible');
  const sec = document.getElementById('sidebar-user-section');
  const av = document.getElementById('sidebar-avatar');
  document.getElementById('sidebar-user-name').textContent = user.name || '';
  document.getElementById('sidebar-user-email').textContent = user.email || '';
  if (user.photo) av.innerHTML = `<img src="${user.photo}" alt="${user.name}">`;
  else av.textContent = (user.name || '?')[0].toUpperCase();
  sec.style.display = 'flex';
  document.getElementById('sidebar-logout').style.display = 'flex';
}).catch(() => {});

const id = new URLSearchParams(location.search).get('id');
if (!id) location.href = '/products.html';

let selectedSize = '', selectedColor = '', qty = 1;

async function loadProduct() {
  const container = document.getElementById('product-detail');
  try {
    const p = await apiFetch(`/api/products/${id}`);
    document.title = `${p.name} — Agas Collection`;
    document.getElementById('bc-name').textContent = p.name;

    const colorMap = {
      'Hitam':'#1a1a1a','Putih':'#f5f5f5','Biru Navy':'#1B3A6B','Merah Marun':'#7B1B2A',
      'Abu-abu':'#888','Krem':'#F5E6C8','Olive':'#6B7C45','Camel':'#C19A6B',
      'Cokelat':'#7B4F2E','Champagne':'#EDD9A3','Biru Indigo':'#2D3A8C',
      'Sage Green':'#87A878','Dusty Pink':'#D4A5A5','Dusty Rose':'#C78B8B'
    };

    const stockInfo = p.stock > 10
      ? `<span style="color:var(--success)">Stok tersedia: ${p.stock} pcs</span>`
      : p.stock > 0
      ? `<span style="color:#E67E22">Stok terbatas: ${p.stock} pcs</span>`
      : `<span style="color:var(--danger)">Stok habis</span>`;

    container.innerHTML = `
      <div class="product-detail-img">
        <img src="${p.image}" alt="${p.name}">
      </div>
      <div class="product-detail-info">
        <div>
          <p class="product-category">${p.category}</p>
          <h1 style="font-family:'Cormorant Garamond',serif;font-size:2.1rem;font-weight:600;margin-bottom:14px;line-height:1.15">${p.name}</h1>
          <p class="product-detail-price">${fmt(p.price)}</p>
        </div>

        <p class="product-detail-desc">${p.description}</p>

        <div>
          <p class="selector-label">Ukuran</p>
          <div class="size-options">
            ${p.sizes.map(s => `<button class="size-btn" data-size="${s}">${s}</button>`).join('')}
          </div>
        </div>

        <div>
          <p class="selector-label">Warna</p>
          <div class="color-options">
            ${p.colors.map(c => `<button class="color-btn" data-color="${c}" title="${c}" style="background:${colorMap[c]||'#ccc'}"></button>`).join('')}
          </div>
          <p id="selected-color" style="font-size:.82rem;color:var(--text-muted);margin-top:10px;min-height:1.2em">&nbsp;</p>
        </div>

        <div>
          <p class="selector-label">Jumlah</p>
          <div class="qty-control">
            <button class="qty-btn" id="qty-dec">−</button>
            <span class="qty-val" id="qty-val">1</span>
            <button class="qty-btn" id="qty-inc">+</button>
          </div>
        </div>

        <div style="display:flex;gap:12px;flex-wrap:wrap">
          <button class="btn btn-primary btn-lg" id="add-cart" style="flex:1;min-width:160px">Tambah ke Keranjang</button>
          <a href="/cart.html" class="btn btn-outline btn-lg" style="flex:1;min-width:120px">Keranjang</a>
        </div>

        <div style="background:var(--bg2);border:1px solid var(--border);border-radius:4px;padding:18px 20px;font-size:.82rem;color:var(--text-muted);display:flex;flex-direction:column;gap:8px">
          <p>${stockInfo}</p>
          <p>Estimasi pengiriman 2–4 hari kerja</p>
          <p>Gratis ongkir di atas Rp 500.000</p>
        </div>
      </div>
    `;

    container.querySelectorAll('.size-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        container.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedSize = btn.dataset.size;
      });
    });

    container.querySelectorAll('.color-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        container.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedColor = btn.dataset.color;
        document.getElementById('selected-color').textContent = `Dipilih: ${selectedColor}`;
      });
    });

    document.getElementById('qty-dec').addEventListener('click', () => {
      if (qty > 1) { qty--; document.getElementById('qty-val').textContent = qty; }
    });
    document.getElementById('qty-inc').addEventListener('click', () => {
      if (qty < p.stock) { qty++; document.getElementById('qty-val').textContent = qty; }
    });

    document.getElementById('add-cart').addEventListener('click', () => {
      if (!selectedSize) return toast('Pilih ukuran terlebih dahulu', 'error');
      if (!selectedColor) return toast('Pilih warna terlebih dahulu', 'error');
      Cart.add(p, selectedSize, selectedColor, qty);
      toast(`${p.name} ditambahkan ke keranjang`, 'success');
    });

  } catch {
    container.innerHTML = '<p style="color:var(--text-muted);padding:60px 0">Produk tidak ditemukan.</p>';
  }
}

loadProduct();
</script>
</body>
</html>
